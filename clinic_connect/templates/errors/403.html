{% extends "base.html" %}
{% block title %}403 - Forbidden / अनधिकृत अनुरोध{% endblock %}
{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; text-align: center; color: var(--text-secondary);">
    <i class="fa-solid fa-shield-halved" style="font-size: 80px; color: var(--color-danger); margin-bottom: 20px;"></i>
    <h2 style="font-family: var(--font-heading); color: var(--text-primary); font-size: 32px; margin-bottom: 10px;">Access Forbidden (403)</h2>
    <p class="trn" data-en="Security token validation failed or access is restricted." 
       data-hi="सुरक्षा टोकन सत्यापन विफल या एक्सेस प्रतिबंधित है।">
        Security token validation failed or access is restricted.
    </p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary" style="margin-top: 20px;">
        <i class="fa-solid fa-house"></i> 
        <span class="trn" data-en="Return to Dashboard" data-hi="डैशबोर्ड पर लौटें">Return to Dashboard</span>
    </a>
</div>
{% endblock %}
