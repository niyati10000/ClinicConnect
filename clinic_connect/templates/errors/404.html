{% extends "base.html" %}
{% block title %}404 - Not Found / पृष्ठ नहीं मिला{% endblock %}
{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; text-align: center; color: var(--text-secondary);">
    <i class="fa-solid fa-compass-drafting" style="font-size: 80px; color: var(--color-primary); margin-bottom: 20px; animation: pulse 2s infinite;"></i>
    <h2 style="font-family: var(--font-heading); color: var(--text-primary); font-size: 32px; margin-bottom: 10px;">Page Not Found (404)</h2>
    <p class="trn" data-en="The requested page could not be located. / पृष्ठ नहीं मिला।" data-hi="खोजा गया पृष्ठ नहीं मिला।">The requested page could not be located.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary" style="margin-top: 20px;">
        <i class="fa-solid fa-house"></i> 
        <span class="trn" data-en="Return to Dashboard" data-hi="डैशबोर्ड पर लौटें">Return to Dashboard</span>
    </a>
</div>
{% endblock %}
